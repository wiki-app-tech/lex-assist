[project]
name = "lex-assist-backend"
version = "0.1.0"
description = "Backend API & Ingestion services for Lex-Assist (TDF, Argentina)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "pyyaml>=6.0.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "qdrant-client>=1.9.0",
    "redis>=5.0.4",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "gdown>=5.2.0",
    "pymupdf>=1.24.0",
    "whoosh>=2.7.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "black>=24.4.2",
    "ruff>=0.4.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
